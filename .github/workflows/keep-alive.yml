# Бесплатный проект Supabase приостанавливается после 7 дней без обращений к БД.
# Этот workflow дважды в неделю вызывает безопасную функцию app_health().
# URL и публикуемый ключ — публичные значения (они и так есть в коде сайта);
# данные защищены политиками RLS.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://doxryfmjiyhlfyhnuwdu.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_rS3w9PaQg7_As29vjCoFsA_6XX4bK1y
    steps:
      - name: Вызов app_health()
        run: |
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/rest/v1/rpc/app_health" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
